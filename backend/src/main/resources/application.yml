server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: devlog
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/devlog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      encoding: UTF-8

llm:
  mode: ${LLM_MODE:mock}
  default:
    temperature: ${LLM_DEFAULT_TEMPERATURE:0.2}
    max-tokens: ${LLM_DEFAULT_MAX_TOKENS:65536}
  mock:
    always-fail: ${LLM_MOCK_ALWAYS_FAIL:false}
  gemini:
    base-url: ${LLM_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    connect-timeout-ms: ${LLM_GEMINI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${LLM_GEMINI_READ_TIMEOUT_MS:30000}
    api-key: ${LLM_GEMINI_API_KEY:}
    model: ${LLM_GEMINI_MODEL:gemini-2.5-flash}

devtalk:
  client:
    base-url: ${DEVTALK_BASE_URL:http://localhost:8080}
    connect-timeout-ms: ${DEVTALK_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${DEVTALK_READ_TIMEOUT_MS:10000}

sync:
  max-pages: ${SYNC_MAX_PAGES:1000}

draft:
  max-selected-blocks: ${DRAFT_MAX_SELECTED_BLOCKS:200}

mcp:
  ingest:
    max-blocks: ${MCP_INGEST_MAX_BLOCKS:500}
    max-messages-per-block: ${MCP_INGEST_MAX_MESSAGES_PER_BLOCK:200}
  event:
    max-content-bytes: ${MCP_EVENT_MAX_CONTENT_BYTES:65536}

